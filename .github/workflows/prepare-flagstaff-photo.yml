name: Prepare Flagstaff photo asset (manual review only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download Flagstaff candidate and check JPEG
        run: node scripts/prepare-flagstaff-photo.mjs
      - name: Upload image for human visual review
        uses: actions/upload-artifact@v4
        with:
          name: flagstaff-photo-review
          path: assets/images/cities/flagstaff-arizona.jpg
          if-no-files-found: error
          retention-days: 30

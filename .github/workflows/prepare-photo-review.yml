name: Prepare destination photo review
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-photo-review.yml'
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download available candidate photographs for review
        run: node scripts/prepare-photo-review.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: destination-photo-review
          path: photo-review/
          retention-days: 14

name: Destination photo integrity
on:
  push:
    branches: [main]
    paths:
      - 'city-photo-manifest.json'
      - 'scripts/check-city-photos.mjs'
      - '.github/workflows/photo-integrity.yml'
  schedule:
    - cron: '15 18 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'city-photo-manifest.json'
      - 'scripts/check-city-photos.mjs'
jobs:
  check-photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check city photo manifest integrity
        run: node scripts/check-city-photos.mjs
      - name: Probe remote photo URLs (diagnostic, not deployment gate)
        id: remote-images
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: node scripts/check-city-photos.mjs --check-remote
      - name: Upload destination URL audit report
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && always()
        uses: actions/upload-artifact@v4
        with:
          name: destination-photo-url-audit
          path: photo-url-audit.json
          if-no-files-found: warn
          retention-days: 30
      - name: Report remote photo probe outcome
        if: steps.remote-images.outcome == 'failure'
        run: echo '::warning::Remote photo checks failed. Review job logs and verify image URLs; manifest integrity was checked separately.'

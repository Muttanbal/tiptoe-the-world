card:nth-child(5n) .art{background:linear-gradient(130deg,#3f513b,#83906d)}.art span{font:normal 55px Georgia,serif;opacity:.5}.card-content{padding:24px;display:flex;flex:1;flex-direction:column}.meta{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#8a6b37;font-weight:bold}.card h2{font:normal 27px/1.2 Georgia,serif;margin:13px 0}.card p{font-size:14px;line-height:1.75;color:#5c6b61;flex:1}.read{font-size:12px;text-transform:uppercase;letter-spacing:.1em;font-weight:bold;color:#916e35}.article{max-width:850px;margin:auto}.article h1{font:normal clamp(40px,6vw,66px)/1.12 Georgia,serif;margin:20px 0}.article .intro{font:normal 24px/1.65 Georgia,serif;color:#3e5a4d}.article p{font-size:18px;line-height:1.95;color:#43584b}.article h2{font:normal 30px Georgia,serif;margin-top:45px}.article .tip{border-left:4px solid var(--gold);padding:10px 25px;background:white;margin:35px 0}.back{display:inline-block;margin-bottom:25px;color:#87652e;font-weight:bold}.cta{display:inline-block;background:var(--forest);color:white;padding:15px 20px;margin:20px 0}.note{font-size:13px!important;color:#68766d!important}footer{padding:35px 6%;background:#092b25;color:#d2ddd5;text-align:center}footer a{color:#f0cc8c}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid{grid-template-columns:1fr}.hero{padding:70px 6%}.article p{font-size:16px}header strong{font-size:24px}}

const articles=[{"id":"kyoto-at-dawn-a-city-before-the-crowds","title":"Kyoto at Dawn: A City Before the Crowds","place":"Japan","category":"Culture","lead":"Kyoto feels different before the shops open and the busiest lanes fill. Begin with a quiet walk rather than a checklist.","story":"In Higashiyama, traditional streets reward slow wandering. Temples and shrines each have their own visiting rules, so look for signs before taking photographs. Pause for tea and let the neighbourhood set the pace.","tip":"Choose one district for a morning rather than crossing the city repeatedly. A guided cultural walk can add context without turning the day into a race.","num":1,"extra":["A morning route worth trying","Begin near Kiyomizu-dera, then descend through Sannenzaka and Ninenzaka, stopping at small craft shops rather than treating the lanes as a shortcut. Continue towards Kodaiji and the Gion area if your legs and schedule allow.","The detail that changes the visit","Kyoto's historic districts are working neighbourhoods. Watch for private-lane restrictions, avoid obstructing doorways, and never chase geiko or maiko for photographs.","What to book, and what to leave free","A small cultural walking tour can make the architecture and traditions more meaningful. Keep the rest of the day flexible for tea, ceramics and unplanned discoveries."]},{"id":"the-marrakech-souk-survival-guide","title":"The Marrakech Souk Survival Guide","place":"Morocco","category":"City guide","lead":"Marrakech is a city best approached with curiosity and a little patience. Its medina is not a shopping mall with straight aisles.","story":"Follow the rhythm of the souks, where workshops, stalls and everyday errands share narrow lanes. Prices may be negotiable in some markets, but a friendly conversation matters more than winning every bargain.","tip":"Keep your accommodation location saved offline. If you want to understand the craft traditions, choose a small-group walking tour with a local guide.","num":2,"extra":["Start with the square, not the shopping","Jemaa el-Fnaa is a useful orientation point before entering the medina's network of souks. Note your route back, then explore craft areas at an unhurried pace.","What the medina actually is","The medina is a historic urban neighbourhood, not simply a market. Homes, workshops, mosques and commerce exist alongside visitor-oriented stalls. A riad courtyard offers a striking contrast to the streets outside.","Make the experience comfortable","Agree on prices before accepting services, ask before photographing people and bring small denominations of cash. A local guide can add context and reduce navigational stress."]},{"id":"a-first-timer-s-guide-to-the-rome-you-can-walk","title":"A First-Timer's Guide to the Rome You Can Walk","place":"Italy","category":"City guide","lead":"Rome is a city of layers: an ancient wall beside a café, a fountain at the end of an ordinary street.","story":"Instead of racing between landmarks, choose a walk that links the historic centre, a few piazzas and a neighbourhood lunch. The best moments often happen between the famous stops.","tip":"Book timed-entry attractions in advance where required. Comfortable shoes are more valuable than an overpacked itinerary.","num":3,"extra":["Build your walk around the historic centre","Choose a route through the Pantheon area, Piazza Navona and the surrounding streets. Ancient fragments appear alongside churches, cafés and everyday businesses.","Don't confuse seeing with understanding","Rome's layers span centuries. One well-led archaeology or history tour may teach more than a day of disconnected monument stops.","A sensible day plan","Reserve major ticketed sites separately, allow time for security queues and take a proper lunch break away from the busiest squares."]},{"id":"paris-beyond-the-postcard","title":"Paris Beyond the Postcard","place":"France","category":"Culture","lead":"There is more to Paris than photographing the Eiffel Tower. The city makes sense in its smaller rituals.","story":"Browse a market, sit by the Seine, and choose one museum you genuinely want to see. Neighbourhood bakeries and side streets often give a better sense of place than another hurried landmark stop.","tip":"Pair one major attraction with a relaxed neighbourhood walk. Leave space for the unexpected.","num":4,"extra":["Give the neighbourhoods a turn","Try a market street, a riverbank walk and one museum rather than attempting the whole city. The appeal is often the transition from grand boulevards to ordinary local streets.","A cultural experience with depth","A specialist museum tour or guided food walk can open up stories that a quick sightseeing bus ride cannot.","Keep the day realistic","Check museum closure days and timed admissions. Pick accommodation and activities near a convenient public-transport route."]},{"id":"bangkok-by-boat-bowl-and-backstreet","title":"Bangkok by Boat, Bowl and Backstreet","place":"Thailand","category":"Food & drink","lead":"Bangkok is easier to love when you stop trying to see everything from a taxi window.","story":"The river offers a different perspective on the city. Between temples and markets, look for a guided food walk that explains ingredients and local eating customs, rather than just pointing at dishes.","tip":"Dress appropriately for temple visits and keep water handy. Street-food stops are best chosen with attention to freshness and hygiene.","num":5,"extra":["See the city from the river","The Chao Phraya offers a natural way to connect riverside districts and temples. Boats also provide relief from road congestion, though boarding points can be busy.","Taste with a purpose","A food guide can explain the balance of sour, salty, sweet and spicy flavours and how dishes vary by neighbourhood.","Practical choices","Allow extra time in the heat, dress modestly for religious sites and avoid overloading the itinerary with distant stops."]},{"id":"the-wild-appeal-of-a-kenyan-safari","title":"The Wild Appeal of a Kenyan Safari","place":"Kenya","category":"Wildlife","lead":"A safari is not a theme park ride. The animals decide what happens, and that uncertainty is part of its beauty.","story":"Look beyond a list of species. Notice tracks, changing light, bird calls and the work of an experienced guide. Wildlife encounters are best when vehicles keep respectful distances.","tip":"Choose operators that follow park rules and prioritise animal welfare. Binoculars can make quiet moments just as rewarding as dramatic sightings.","num":6,"extra":["Learn to enjoy the waiting","Game drives include long stretches of watching and listening. That quiet time lets a guide interpret tracks, birds and habitat rather than racing between sightings.","Ask better questions of operators","Find out about group size, vehicle arrangements, park fees and animal-welfare practices. A lower-impact safari is worth prioritising over promises of close encounters.","What to pack","Neutral clothing, sun protection, a warm layer for early starts and binoculars make a meaningful difference. Wildlife is never guaranteed."]},{"id":"machu-picchu-more-than-a-photograph","title":"Machu Picchu: More Than a Photograph","place":"Peru","category":"History","lead":"Machu Picchu is famous for its view, but its story deserves more than a quick photo stop.","story":"The setting, stonework and surrounding mountains make the site extraordinary. Entry routes and permitted circuits can change, so understand your ticket before arriving.","tip":"Plan transport and admission well ahead of time. A knowledgeable guide can help connect the architecture with the wider Inca world.","num":7,"extra":["Plan the logistics first","Access involves specific transport arrangements and admission rules. Decide whether you want a day visit or a longer journey before building the rest of your Peru itinerary.","Look beyond the viewpoint","Ask about the site's terraces, drainage, construction and relationship with the surrounding landscape. The engineering story is as compelling as the photographs.","Travel responsibly","Stay within your permitted circuit, follow guide and site instructions, and prepare for altitude and changeable mountain weather."]},{"id":"auckland-the-city-between-two-harbours","title":"Auckland: The City Between Two Harbours","place":"New Zealand","category":"City guide","lead":"Auckland is often treated as a gateway. Give it a day and it starts to reveal its own character.","story":"Waterfront walks, volcanic viewpoints and neighbourhood cafés offer an easy introduction. Depending on the weather, a ferry journey can be as memorable as a conventional sightseeing tour.","tip":"Build in travel time: the city spreads across a large area. Choose a compact route instead of attempting every viewpoint in one day.","num":8,"extra":["Choose a harbour, then a neighbourhood","A waterfront walk and a ferry outing can create a satisfying introduction without long drives. Add a volcanic viewpoint if weather and transport allow.","Look for the city's layers","Auckland's landscapes are shaped by volcanic activity and its history is inseparable from the harbour and mana whenua. Experiences led by knowledgeable local hosts can add perspective.","Don't underestimate distances","The metropolitan area is extensive. Combine nearby sights instead of stitching together a dozen cross-city stops."]},{"id":"queenstown-without-the-adrenaline-rush","title":"Queenstown Without the Adrenaline Rush","place":"New Zealand","category":"Nature","lead":"Queenstown has a reputation for thrills, but you do not need to jump off anything to enjoy it.","story":"Take a lakeside walk, explore nearby scenery or join a gentle sightseeing excursion. The mountains change colour as the day moves, making even a quiet afternoon feel cinematic.","tip":"Mountain weather can shift quickly. Check conditions before booking outdoor experiences and leave flexibility in the schedule.","num":9,"extra":["Make the lake the centrepiece","A waterfront stroll and a scenic outing can fill a day without extreme sports. Short trips to surrounding viewpoints offer different perspectives on the mountains.","The weather is part of the story","Cloud and changing light can make familiar scenery feel entirely different. Choose flexible experiences if your schedule allows.","Know your pace","Check transport requirements, seasonal availability and walking grades before booking an excursion."]},{"id":"sydney-from-the-water","title":"Sydney From the Water","place":"Australia","category":"City guide","lead":"Some cities are best understood from above. Sydney makes a persuasive case for seeing it from the harbour.","story":"A ferry or harbour cruise brings the Opera House, bridge and shoreline into one changing panorama. Then walk through a nearby precinct instead of spending the day in transit.","tip":"Check sailing schedules and departure wharves carefully. Late afternoon light is particularly lovely when conditions cooperate.","num":10,"extra":["Use the harbour as your first orientation","A public ferry or sightseeing cruise reveals the city's geography more naturally than a long road loop. Follow with a walk in a nearby waterfront precinct.","Photography without the rush","The bridge and Opera House look different as boats move. Put the camera down occasionally and watch the working harbour.","Planning details","Confirm the correct wharf, sailing time and return options, especially if you have a timed activity later."]},{"id":"the-art-of-doing-less-in-lisbon","title":"The Art of Doing Less in Lisbon","place":"Portugal","category":"Slow travel","lead":"Lisbon rewards people who are willing to get a little lost and stop for coffee.","story":"Hills, tiled façades and viewpoints make short distances feel like journeys. Pick one neighbourhood, listen to the sounds around you and let a long lunch count as sightseeing.","tip":"Wear shoes with grip on polished paving. A guided walk can be helpful on the steeper streets.","num":11,"extra":["Accept the hills","Lisbon's slopes are part of its personality. Allow time to climb slowly, stop at viewpoints and explore one district in depth.","Find the smaller stories","Tiles, cafés and local shops make excellent subjects for a heritage or food walk. Listen for how neighbourhood histories differ.","Comfort matters","Cobblestones can be slippery and tram queues can be long. Walking and public transport work best when you plan a modest route."]},{"id":"istanbul-a-city-of-crossings","title":"Istanbul: A City of Crossings","place":"Turkey","category":"History","lead":"In Istanbul, a short ferry journey can feel like crossing between chapters of a story.","story":"Markets, waterfronts and monumental architecture reveal a city shaped by many histories. A good guide helps separate legend from fact while leaving room to enjoy the atmosphere.","tip":"Respect dress requirements at active religious sites. Avoid trying to cover both sides of the city in a single hurried afternoon.","num":12,"extra":["Cross the water","A ferry ride gives the city's skyline a new dimension and makes the Bosphorus part of the experience rather than a backdrop.","Go beyond the grand monuments","Markets and residential streets tell everyday stories. Combine a major historical site with a slower neighbourhood experience.","Visit respectfully","Religious sites may close temporarily for worship and have clothing rules. Check official visitor guidance before arriving."]},{"id":"the-delicious-logic-of-a-naples-food-walk","title":"The Delicious Logic of a Naples Food Walk","place":"Italy","category":"Food & drink","lead":"Naples is not a city where food should be treated as an afterthought.","story":"Street snacks, neighbourhood bakeries and pizza traditions tell stories about work, family and place. A food walk works best when it includes the people behind the dishes.","tip":"Arrive hungry but not starving. Ask about allergens before tasting, especially in busy markets.","num":13,"extra":["Eat your way into the city's story","Look for a route that includes neighbourhood bakeries, street snacks and traditional pizza. The best guides explain ingredients and techniques rather than only offering samples.","The difference between tasting and touring","Food culture is tied to work, migration and family traditions. A good experience leaves you understanding why a dish matters.","Prepare for a lively city","Wear comfortable shoes, watch traffic at crossings and communicate allergies clearly before tastings begin."]},{"id":"new-york-on-foot-one-neighbourhood-at-a-time","title":"New York on Foot: One Neighbourhood at a Time","place":"United States","category":"City guide","lead":"New York is enormous. The trick is to make your day deliberately small.","story":"Choose a neighbourhood and let its parks, architecture, independent shops and food stops form the itinerary. You will see more by walking well than by crossing town for every famous photo.","tip":"Use public transport for longer hops. Check museum reservations before setting out.","num":14,"extra":["Think in neighbourhoods","A walk in one district can combine architecture, parks, food and people-watching. Save major museums for a separate block of time.","Try a themed perspective","Architecture, immigration history, street art and food are all useful lenses for understanding the city.","A practical rule","Use the subway for longer journeys, but allow extra time for transfers and busy stations."]},{"id":"the-quiet-magic-of-iceland-s-landscapes","title":"The Quiet Magic of Iceland's Landscapes","place":"Iceland","category":"Nature","lead":"Iceland's scenery looks almost unreal, but it is also fragile and weather-dependent.","story":"Waterfalls, geothermal areas and broad volcanic landscapes invite exploration. Marked paths exist for good reasons: hot ground, unstable edges and delicate vegetation can be hazardous.","tip":"Check official weather and road updates before leaving town. Never stop on a road simply because the view is beautiful.","num":15,"extra":["Respect the landscape","Geothermal areas and waterfalls can be dangerous beyond marked routes. Staying on trails protects visitors and delicate terrain.","Choose conditions over ambition","Road and weather conditions can change quickly. A smaller, safe itinerary beats a long drive that becomes a race against daylight.","Plan with local updates","Consult official road and weather information before leaving and have a backup plan for outdoor excursions."]},{"id":"cape-town-mountain-coast-and-city","title":"Cape Town: Mountain, Coast and City","place":"South Africa","category":"Nature","lead":"Cape Town can offer three very different moods in one day.","story":"Start with a coastal viewpoint, explore an urban neighbourhood and keep mountain plans flexible around the weather. The best itinerary leaves space for the city rather than treating it as scenery alone.","tip":"Use established transport and local guidance when choosing routes. Mountain access depends on conditions.","num":16,"extra":["Balance the three sides of the city","Combine a coastal view, an urban cultural stop and—weather permitting—a mountain experience. Trying to do all three at speed diminishes each.","Choose a thoughtful guide","Local history, neighbourhood context and conservation issues make Cape Town much richer than a scenic-photo circuit.","Keep safety practical","Use established transport, follow current local advice and avoid exposed mountain routes in poor conditions."]},{"id":"a-taste-of-lima-beyond-the-familiar","title":"A Taste of Lima Beyond the Familiar","place":"Peru","category":"Food & drink","lead":"Lima's food scene is a wonderful way to begin understanding Peru's regions and influences.","story":"Markets and neighbourhood restaurants introduce ingredients, traditions and contemporary cooking. Look for experiences that explain where dishes come from rather than offering tastings without context.","tip":"Tell your guide about dietary restrictions in advance. Choose food stops with sound hygiene practices.","num":17,"extra":["Start with ingredients","A market visit can introduce regional produce and flavours before you sit down to taste prepared dishes.","Ask what shaped the plate","Lima's cooking reflects coastal ingredients and many cultural influences. A food tour should make these connections clear.","Book thoughtfully","Discuss dietary needs in advance and choose operators that are transparent about tasting locations and hygiene."]},{"id":"the-case-for-a-slow-day-in-florence","title":"The Case for a Slow Day in Florence","place":"Italy","category":"Art","lead":"Florence invites visitors to collect masterpieces. A better day sometimes begins by choosing fewer of them.","story":"Pick one gallery, walk across the river and spend time noticing the details of streets and workshops. The city's artistic heritage is not confined to museum walls.","tip":"Reserve major galleries ahead when possible. Early starts can make the busiest areas more pleasant.","num":18,"extra":["Choose one masterpiece at a time","A focused gallery visit followed by a long walk is often more memorable than collecting several ticketed attractions in a day.","Cross the river","Explore a quieter street or artisan area after the major sights. Florence's creative traditions continue outside museum galleries.","Protect your time","Timed tickets and security checks affect schedules. Leave space for a meal and unstructured wandering."]},{"id":"tokyo-after-dark-neon-and-neighbourhoods","title":"Tokyo After Dark: Neon and Neighbourhoods","place":"Japan","category":"City guide","lead":"Tokyo at night is not one single scene. Every district has its own energy.","story":"An evening might mean a lively shopping street, a small restaurant or a calm riverside walk. Choose the atmosphere you want rather than following the brightest lights automatically.","tip":"Check the last train before heading out. Respect photography restrictions in small businesses and residential streets.","num":19,"extra":["Choose the right district for your mood","An evening can mean busy neon streets, intimate dining lanes or a peaceful waterfront. Tokyo's scale rewards a deliberate choice.","Learn local etiquette","Small bars and restaurants may have limited seating or specific house rules. A local evening guide can make the experience more approachable.","Get home easily","Check train times and keep your accommodation address saved. Don't assume every venue welcomes photography."]},{"id":"why-the-great-barrier-reef-deserves-careful-choices","title":"Why the Great Barrier Reef Deserves Careful Choices","place":"Australia","category":"Marine life","lead":"A reef experience should leave you with wonder, not a sense that the ocean is a backdrop.","story":"Responsible operators explain conditions, reef ecology and how visitors can minimise harm. Even a short snorkel can reveal intricate relationships between coral, fish and water.","tip":"Never touch or stand on coral. Choose operators with clear environmental practices and follow their safety briefing.","num":20,"extra":["Pick the right operator","Ask how guides explain reef ecology, what safety supervision is provided and how the business minimises environmental impact.","Look closer underwater","Reef life is intricate. A slower snorkel can reveal relationships that a hurried excursion misses.","Protect yourself and the reef","Follow briefings, avoid touching marine life or coral and use suitable sun protection. Conditions and visibility vary."]},{"id":"the-romance-of-a-scottish-highlands-road-trip","title":"The Romance of a Scottish Highlands Road Trip","place":"Scotland","category":"Road trips","lead":"The Highlands are a reminder that a journey can be the main event.","story":"Lochs, mountain passes and small villages encourage frequent pauses. Keep daily driving distances modest so a viewpoint or café stop does not feel like a delay.","tip":"Roads can be narrow and conditions change. Use designated stopping places and allow extra time.","num":21,"extra":["Let the route breathe","Plan short driving days with time for viewpoints and village stops. The appeal is in the spaces between major destinations.","Watch the conditions","Single-track roads and mountain weather require patience and careful driving. Never stop in passing places for photographs.","Add a human story","A local heritage or nature guide can connect the scenery with the people who have lived and worked there."]},{"id":"barcelona-through-architecture","title":"Barcelona Through Architecture","place":"Spain","category":"Art","lead":"Barcelona's buildings make a compelling walking itinerary, even before you step inside a museum.","story":"Look at how older streets meet modernist design, and how public spaces shape daily life. Guided architecture walks can explain details that are easy to miss.","tip":"Book popular interiors in advance. Give each neighbourhood enough time to be more than a photo stop.","num":22,"extra":["Look up, then look closer","Barcelona's façades reward attention to details, materials and shapes. A walking route can connect major landmarks with less famous streets.","Use architecture as a doorway","Buildings reveal changing ideas about the city, public space and design. Specialist guides can help decode them.","Plan admissions","Reserve popular interiors ahead and avoid scheduling multiple timed entries too close together."]},{"id":"the-allure-of-an-essaouira-afternoon","title":"The Allure of an Essaouira Afternoon","place":"Morocco","category":"Slow travel","lead":"Essaouira offers a different rhythm from Morocco's larger inland cities.","story":"Its coastal setting, historic streets and working harbour invite wandering. Spend time observing the town rather than trying to fill every hour with activities.","tip":"Coastal wind can be strong. Bring a layer and be considerate when photographing people at work.","num":23,"extra":["Spend time near the water","The harbour and historic streets make an inviting combination. Watch the activity of a working port without getting in anyone's way.","Discover the slower rhythm","Small galleries, workshops and cafés provide a counterpoint to the busier medinas inland.","Dress for the coast","Wind is common. Bring a light layer and ask before photographing workers or residents."]},{"id":"the-best-way-to-meet-singapore-eat-and-walk","title":"The Best Way to Meet Singapore: Eat and Walk","place":"Singapore","category":"Food & drink","lead":"Singapore's neighbourhoods tell their stories through food, architecture and everyday life.","story":"A walking route that combines heritage streets with hawker centres reveals how many cultures shape the city. Order a few different dishes and take your time.","tip":"Popular food centres get busy at peak periods. Carry water and prepare for heat and humidity.","num":24,"extra":["Begin with a hawker centre","Choose a few dishes to share and notice how food traditions sit alongside one another. A guided food walk can help first-time visitors order confidently.","Walk between the meals","Heritage streets, places of worship and architecture offer context for the city's multicultural identity.","Make the day comfortable","Expect humidity, drink water and respect local rules around cleanliness and public spaces."]},{"id":"the-magic-of-a-santorini-morning","title":"The Magic of a Santorini Morning","place":"Greece","category":"Slow travel","lead":"Santorini's famous views are beautiful, but the quieter hours can be even more memorable.","story":"Early walks reveal the island's architecture and dramatic caldera setting before the busiest crowds. Seek out local history and smaller settlements as well as iconic viewpoints.","tip":"Paths can be steep and exposed. Carry sun protection and respect private properties.","num":25,"extra":["See the caldera early","Morning light and quieter lanes offer a different experience from the busiest sunset viewpoints.","Explore beyond one photograph","Architecture, volcanic geography and smaller settlements deserve attention too. A guided history walk can broaden the visit.","Know the terrain","Steps, steep paths and heat can make walking demanding. Wear supportive shoes and stay out of private spaces."]},{"id":"vancouver-where-the-city-meets-the-outdoors","title":"Vancouver: Where the City Meets the Outdoors","place":"Canada","category":"Nature","lead":"Vancouver makes it easy to pair a city morning with an outdoor afternoon.","story":"Waterfront paths, public parks and mountain views shape its identity. Choose one area to explore thoroughly rather than crossing the city for a series of quick stops.","tip":"Rain is part of the local climate. Bring a light waterproof layer and check trail conditions.","num":26,"extra":["Choose an outdoor anchor","A park or waterfront path can provide a satisfying introduction. Add a neighbourhood food stop rather than packing in distant attractions.","Think seasonally","Rain, snow and trail conditions shape what is realistic. A city walk and a mountain outing require different preparation.","Plan the return","Check transport schedules and daylight before heading to a trail or remote viewpoint."]},{"id":"buenos-aires-and-the-pleasure-of-a-long-evening","title":"Buenos Aires and the Pleasure of a Long Evening","place":"Argentina","category":"Culture","lead":"Buenos Aires often comes alive in the hours when other cities are winding down.","story":"Cafés, neighbourhood streets and music venues offer different ways to experience its character. Tango can be a performance, a social tradition or a lesson in listening.","tip":"Check venue details and booking policies. A local guide can help navigate neighbourhood choices after dark.","num":27,"extra":["Follow the city's evening rhythm","An early café stop, neighbourhood walk and later music experience can reveal contrasting sides of Buenos Aires.","Understand tango in context","A performance and a participatory lesson are different experiences. Choose what interests you rather than assuming one represents the whole tradition.","Book with care","Check start times, venue location and transport options, especially for late-night activities."]},{"id":"hanoi-the-city-that-rewards-attention","title":"Hanoi: The City That Rewards Attention","place":"Vietnam","category":"City guide","lead":"Hanoi is full of small moments that disappear if you rush.","story":"Walk through older streets, pause for coffee and watch the movement of daily life. A thoughtful guide can explain local customs and help make sense of the city's layered history.","tip":"Cross streets carefully and predictably. Keep valuables secure in crowded areas.","num":28,"extra":["Walk with your senses switched on","Older streets, food stalls and cafés reward slow exploration. Look for a route that balances busy corners with calmer pauses.","A guide adds context","Local history and food traditions can be difficult to understand from appearances alone. A knowledgeable host makes the visit more rewarding.","Move thoughtfully","Traffic can be intense. Cross steadily, stay alert and keep belongings secure in crowds."]},{"id":"a-different-kind-of-dubai-day","title":"A Different Kind of Dubai Day","place":"United Arab Emirates","category":"City guide","lead":"Dubai's skyline attracts attention, but the city's story is broader than its tallest buildings.","story":"Balance modern architecture with waterfront areas, markets and cultural districts. Choosing contrasting experiences makes for a richer day than visiting only observation decks.","tip":"Consider the heat when planning outdoor walks. Check opening hours and dress expectations for cultural sites.","num":29,"extra":["Contrast old and new","A day might combine a historic waterfront or cultural district with the modern skyline. The contrast tells a more interesting story than height alone.","Consider the climate","Outdoor exploration is more comfortable when scheduled around the heat. Indoor cultural experiences make useful alternatives.","Check customs and access","Dress expectations vary by venue, and opening arrangements can change around religious observances."]},{"id":"the-joy-of-exploring-rotorua-with-curiosity","title":"The Joy of Exploring Rotorua With Curiosity","place":"New Zealand","category":"Nature & culture","lead":"Rotorua is a place where landscapes and living culture deserve equal attention.","story":"Geothermal features, forest walks and Māori cultural experiences offer very different perspectives. Choose operators who present culture respectfully and explain the meaning behind what visitors see.","tip":"Stay on marked paths around geothermal areas. Book cultural experiences directly with reputable hosts where possible.","num":30,"extra":["Treat geothermal areas with respect","Steam, mineral colours and bubbling features are extraordinary but can be hazardous. Stay on marked paths and follow site instructions.","Seek authentic cultural context","Māori-led experiences can share history, arts and contemporary perspectives in ways a generic sightseeing stop cannot.","Build a balanced day","Combine one geothermal attraction with a forest or cultural experience rather than rushing through several similar stops."]}];
const root=document.getElementById('content');
const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const params=new URLSearchParams(location.search);const id=params.get('post');const a=articles.find(x=>x.id===id);
if(a){document.title=a.title+' | Tiptoe the World';document.querySelector('.hero').style.display='none';const query=encodeURIComponent(a.place+' tours and experiences');root.innerHTML='<article class="article"><a class="back" href="blogs.html">← All travel stories</a><div class="meta">'+safe(a.category)+' · '+safe(a.place)+'</div><h1>'+safe(a.title)+'</h1><p class="intro">'+safe(a.lead)+'</p><h2>Look a little closer</h2><p>'+safe(a.story)+'</p><h2>'+safe(a.extra[0])+'</h2><p>'+safe(a.extra[1])+'</p><h2>'+safe(a.extra[2])+'</h2><p>'+safe(a.extra[3])+'</p><h2>'+safe(a.extra[4])+'</h2><p>'+safe(a.extra[5])+'</p><h2>Make it your own</h2><div class="tip"><p>'+safe(a.tip)+'</p></div><p>Every journey is different. Use this story as inspiration, then check local conditions, opening times and availability before making plans.</p><a class="cta" href="https://www.getyourguide.com/s/?q='+query+'&partner_id=MYN4RIJ" target="_blank" rel="noopener sponsored">Browse experiences in '+safe(a.place)+' →</a><p class="note">Experience listings are provided by an external booking partner. Availability and prices may change.</p></article>';}
else{const cats=['All',...new Set(articles.map(x=>x.category))];root.innerHTML='<div class="filters" role="group" aria-label="Filter travel stories">'+cats.map((c,i)=>'<button type="button" aria-pressed="'+(i===0)+'" data-cat="'+safe(c)+'">'+safe(c)+'</button>').join('')+'</div><div class="grid" id="stories"></div>';const draw=cat=>{document.getElementById('stories').innerHTML=articles.filter(x=>cat==='All'||x.category===cat).map(x=>'<a class="card" href="blogs.html?post='+encodeURIComponent(x.id)+'"><div class="art"><span>'+String(x.num).padStart(2,'0')+'</span></div><div class="card-content"><div class="meta">'+safe(x.category)+' · '+safe(x.place)+'</div><h2>'+safe(x.title)+'</h2><p>'+safe(x.lead)+'</p><span class="read">Read story →</span></div></a>').join('')};draw('All');document.querySelectorAll('[data-cat]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-cat]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));draw(b.dataset.cat)}));}
</script></body></html>
